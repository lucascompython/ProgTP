<!DOCTYPE html>

    <title>ProgTP Lucas de Linhares</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;

            width: 100%;

        }

        .text {

            white-space: pre;
        }
    </style>

<script src="./index.js"></script>
<script type="module">
    const CLAY_RENDER_COMMAND_TYPE_NONE = 0;
    const CLAY_RENDER_COMMAND_TYPE_RECTANGLE = 1;
    const CLAY_RENDER_COMMAND_TYPE_BORDER = 2;
    const CLAY_RENDER_COMMAND_TYPE_TEXT = 3;
    const CLAY_RENDER_COMMAND_TYPE_IMAGE = 4;
    const CLAY_RENDER_COMMAND_TYPE_SCISSOR_START = 5;
    const CLAY_RENDER_COMMAND_TYPE_SCISSOR_END = 6;
    const CLAY_RENDER_COMMAND_TYPE_CUSTOM = 7;
    const PROGTP_APP_ACTION_NONE = 0;
    const PROGTP_APP_ACTION_NEXT = 1;
    const PROGTP_APP_ACTION_PREVIOUS = 2;
    const PROGTP_APP_ACTION_ADD_SAMPLE = 3;
    const PROGTP_APP_ACTION_UPDATE_SELECTED = 4;
    const PROGTP_APP_ACTION_REMOVE_SELECTED = 5;
    const PROGTP_APP_ACTION_CYCLE_STATE = 6;
    const PROGTP_APP_ACTION_TOGGLE_PENDING = 7;
    const PROGTP_APP_ACTION_SEARCH_CODE = 12;
    const PROGTP_APP_ACTION_SEARCH_IP = 13;
    const PROGTP_APP_ACTION_SEARCH_MAC = 14;
    const PROGTP_APP_ACTION_INPUT_BACKSPACE = 16;
    const PROGTP_APP_ACTION_INPUT_SUBMIT = 17;
    const PROGTP_APP_ACTION_SAVE = 18;
    const PROGTP_APP_ACTION_LOAD = 19;
    const PROGTP_APP_ACTION_MODULE_1 = 20;
    const PROGTP_APP_ACTION_MODULE_2 = 21;
    const PROGTP_APP_ACTION_MODULE_3 = 22;
    const PROGTP_APP_ACTION_MODULE_4 = 23;
    const PROGTP_APP_ACTION_MODULE_5 = 24;
    const PROGTP_APP_ACTION_MODULE_6 = 25;
    const PROGTP_APP_ACTION_MODULE_7 = 26;
    const PROGTP_APP_ACTION_MODULE_8 = 27;
    const PROGTP_APP_ACTION_FORM_SUBMIT = 28;
    const PROGTP_APP_ACTION_FORM_CANCEL = 29;
    const PROGTP_APP_ACTION_FORM_NEXT_FIELD = 30;
    const PROGTP_APP_ACTION_FORM_PREVIOUS_FIELD = 31;
    const PROGTP_APP_ACTION_SENSOR_IMPORT = 55;
    const GLOBAL_FONT_SCALING_FACTOR = 0.8;
    let renderCommandSize = 0;
    let scratchSpaceAddress = 0;
    let heapSpaceAddress = 0;
    let instance;
    let memoryDataView;
    let textDecoder = new TextDecoder("utf-8");
    let textEncoder = new TextEncoder();
    let previousFrameTime;
    let pendingInputEvents = [];
    let saveInFlight = false;
    let connectivityInFlight = false;
    let sensorImportInFlight = false;
    let lastSaveAttemptVersion = 0;
    let fontsById = [
        "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
    ];
    let elementCache = {};
    let imageCache = {};
    let colorDefinition = {
        type: 'struct', members: [
            { name: 'r', type: 'float' },
            { name: 'g', type: 'float' },
            { name: 'b', type: 'float' },
            { name: 'a', type: 'float' },
        ]
    };
    let stringDefinition = {
        type: 'struct', members: [
            { name: 'length', type: 'uint32_t' },
            { name: 'chars', type: 'uint32_t' },
        ]
    };
    let stringSliceDefinition = {
        type: 'struct', members: [
            { name: 'length', type: 'uint32_t' },
            { name: 'chars', type: 'uint32_t' },
            { name: 'baseChars', type: 'uint32_t' },
        ]
    };
    let cornerRadiusDefinition = {
        type: 'struct', members: [
            { name: 'topLeft', type: 'float' },
            { name: 'topRight', type: 'float' },
            { name: 'bottomLeft', type: 'float' },
            { name: 'bottomRight', type: 'float' },
        ]
    };
    let borderWidthDefinition = {
        type: 'struct', members: [
            { name: 'left', type: 'uint16_t' },
            { name: 'right', type: 'uint16_t' },
            { name: 'top', type: 'uint16_t' },
            { name: 'bottom', type: 'uint16_t' },
            { name: 'betweenChildren', type: 'uint16_t' },
            { name: '_padding', type: 'uint16_t' },
        ]
    };
    let rectangleRenderDataDefinition = {
        name: 'rectangle', type: 'struct', members: [
            { name: 'backgroundColor', ...colorDefinition },
            { name: 'cornerRadius', ...cornerRadiusDefinition },
        ]
    };
    let textRenderDataDefinition = {
        name: 'text', type: 'struct', members: [
            { name: 'stringContents', ...stringSliceDefinition },
            { name: 'textColor', ...colorDefinition },
            { name: 'fontId', type: 'uint16_t' },
            { name: 'fontSize', type: 'uint16_t' },
            { name: 'letterSpacing', type: 'uint16_t' },
            { name: 'lineHeight', type: 'uint16_t' },
        ]
    };
    let textElementConfigDefinition = {
        name: 'textConfig', type: 'struct', members: [
            { name: 'userData', type: 'uint32_t' },
            { name: 'textColor', ...colorDefinition },
            { name: 'fontId', type: 'uint16_t' },
            { name: 'fontSize', type: 'uint16_t' },
            { name: 'letterSpacing', type: 'uint16_t' },
            { name: 'lineHeight', type: 'uint16_t' },
            { name: 'wrapMode', type: 'uint8_t' },
            { name: 'textAlignment', type: 'uint8_t' },
        ]
    };
    let imageRenderDataDefinition = {
        name: 'image', type: 'struct', members: [
            { name: 'backgroundColor', ...colorDefinition },
            { name: 'cornerRadius', ...cornerRadiusDefinition },
            { name: 'imageData', type: 'uint32_t' }
        ]
    };
    let customRenderDataDefinition = {
        name: 'custom', type: 'struct', members: [
            { name: 'backgroundColor', ...colorDefinition },
            { name: 'cornerRadius', ...cornerRadiusDefinition },
            { name: 'customData', type: 'uint32_t' },
        ]
    }
    let borderRenderDataDefinition = {
        name: 'border', type: 'struct', members: [
            { name: 'color', ...colorDefinition },
            { name: 'cornerRadius', ...cornerRadiusDefinition },
            { name: 'width', ...borderWidthDefinition },
        ]
    };
    let clipRenderDataDefinition = {
        name: 'clip', type: 'struct', members: [
            { name: 'horizontal', type: 'uint8_t' },
            { name: 'vertical', type: 'uint8_t' },
        ]
    };
    let overlayColorRenderDataDefinition = {
        name: 'overlayColor', type: 'struct', members: [
            { name: 'color', ...colorDefinition },
        ]
    };
    let renderDataDefinition = {
        name: 'renderData', type: 'union', members: [
            rectangleRenderDataDefinition,
            textRenderDataDefinition,
            imageRenderDataDefinition,
            customRenderDataDefinition,
            borderRenderDataDefinition,
            clipRenderDataDefinition,
            overlayColorRenderDataDefinition,
        ]
    };
    let renderCommandDefinition = {
        name: 'Clay_RenderCommand',
        type: 'struct',
        members: [
            {
                name: 'boundingBox', type: 'struct', members: [
                    { name: 'x', type: 'float' },
                    { name: 'y', type: 'float' },
                    { name: 'width', type: 'float' },
                    { name: 'height', type: 'float' },
                ]
            },
            renderDataDefinition,
            { name: 'userData', type: 'uint32_t' },
            { name: 'id', type: 'uint32_t' },
            { name: 'zIndex', type: 'uint16_t' },
            { name: 'commandType', type: 'uint8_t' },
            { name: '_padding', type: 'uint8_t' },
        ]
    };

    function getStructTotalSize(definition) {
        switch (definition.type) {
            case 'union':
            case 'struct': {
                let totalSize = 0;
                for (const member of definition.members) {
                    let result = getStructTotalSize(member);
                    if (definition.type === 'struct') {
                        totalSize += result;
                    } else {
                        totalSize = Math.max(totalSize, result);
                    }
                }
                return totalSize;
            }
            case 'float': return 4;
            case 'uint32_t': return 4;
            case 'uint16_t': return 2;
            case 'uint8_t': return 1;
            default: {
                throw "Unimplemented C data type " + definition.type
            }
        }
    }

    function readStructAtAddress(address, definition) {
        switch (definition.type) {
            case 'union':
            case 'struct': {
                let struct = { __size: 0 };
                for (const member of definition.members) {
                    let result = readStructAtAddress(address, member);
                    struct[member.name] = result;
                    if (definition.type === 'struct') {
                        struct.__size += result.__size;
                        address += result.__size;
                    } else {
                        struct.__size = Math.max(struct.__size, result.__size);
                    }
                }
                return struct;
            }
            case 'float': return { value: memoryDataView.getFloat32(address, true), __size: 4 };
            case 'uint32_t': return { value: memoryDataView.getUint32(address, true), __size: 4 };
            case 'uint16_t': return { value: memoryDataView.getUint16(address, true), __size: 2 };
            case 'uint8_t': return { value: memoryDataView.getUint8(address), __size: 1 };
            default: {
                throw "Unimplemented C data type " + definition.type
            }
        }
    }

    function getTextDimensions(text, font) {
        // re-use canvas object for better performance
        window.canvasContext.font = font;
        let metrics = window.canvasContext.measureText(text);
        let fontSize = Number.parseFloat(font) || 16;
        let height = metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent;
        if (!Number.isFinite(height) || height <= 0) {
            height = fontSize * 1.25;
        }
        return { width: metrics.width, height };
    }

    function refreshMemoryView() {
        if (!memoryDataView || memoryDataView.buffer !== instance.exports.memory.buffer) {
            memoryDataView = new DataView(instance.exports.memory.buffer);
        }
    }

    function setSharedLabel(value) {
        const labelBuffer = instance.exports.GetCommandLabelBuffer();
        const labelCapacity = instance.exports.GetCommandLabelCapacity();
        const bytes = textEncoder.encode(value);
        const output = new Uint8Array(instance.exports.memory.buffer);
        const length = Math.min(bytes.length, labelCapacity - 1);
        output.set(bytes.subarray(0, length), labelBuffer);
        output[labelBuffer + length] = 0;
    }

    async function loadCommandLabel() {
        try {
            const response = await fetch("/api/hello");
            if (!response.ok) {
                setSharedLabel("Mode: local | server unavailable");
                return;
            }
            const data = await response.json();
            setSharedLabel(data.mode === "server" ? "Mode: connected to server | inventory stored on server PC" : "Mode: local | browser memory");
        } catch {
            setSharedLabel("Mode: local | server unavailable");
        }
    }

    function writeInventoryJson(jsonText) {
        const buffer = instance.exports.GetInventoryJsonBuffer();
        const capacity = instance.exports.GetInventoryJsonCapacity();
        const bytes = textEncoder.encode(jsonText);
        if (bytes.length >= capacity) {
            throw new Error("Inventory JSON is too large for the WASM buffer");
        }
        new Uint8Array(instance.exports.memory.buffer).set(bytes, buffer);
        return Boolean(instance.exports.ImportInventoryJson(bytes.length));
    }

    async function loadInventory() {
        try {
            const response = await fetch("/api/inventory", { cache: "no-store" });
            if (!response.ok) {
                setSharedLabel("Mode: local | server unavailable");
                return;
            }
            const jsonText = await response.text();
            if (writeInventoryJson(jsonText)) {
                setSharedLabel("Mode: connected to server | inventory stored on server PC");
            }
        } catch {
            setSharedLabel("Mode: local | server unavailable");
        }
    }

    async function loadSensors() {
        try {
            const response = await fetch("/api/sensors", { cache: "no-store" });
            if (!response.ok) {
                return;
            }
            const jsonText = await response.text();
            const length = writeSharedJson(jsonText);
            if (length > 0) {
                instance.exports.ImportSensorsJson(length);
            }
        } catch {
        }
    }

    async function saveInventoryIfDirty() {
        if (saveInFlight || !instance.exports.IsInventoryDirty()) {
            return;
        }
        const version = instance.exports.GetInventoryVersion();
        if (version === lastSaveAttemptVersion) {
            return;
        }
        const length = instance.exports.ExportInventoryJson();
        if (length === 0) {
            lastSaveAttemptVersion = version;
            return;
        }
        const buffer = instance.exports.GetInventoryJsonBuffer();
        const jsonText = textDecoder.decode(new Uint8Array(instance.exports.memory.buffer, buffer, length));
        saveInFlight = true;
        lastSaveAttemptVersion = version;
        try {
            const response = await fetch("/api/inventory", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: jsonText,
            });
            if (response.ok) {
                instance.exports.MarkInventoryClean();
                setSharedLabel("Mode: connected to server | inventory stored on server PC");
            } else {
                setSharedLabel("Mode: local | HTTP save failed");
            }
        } catch {
            setSharedLabel("Mode: local | HTTP save failed");
        } finally {
            saveInFlight = false;
        }
    }

    function writeSharedJson(text) {
        const bytes = textEncoder.encode(text);
        const capacity = instance.exports.GetInventoryJsonCapacity();
        if (bytes.length >= capacity) {
            return 0;
        }
        const buffer = instance.exports.GetInventoryJsonBuffer();
        new Uint8Array(instance.exports.memory.buffer).set(bytes, buffer);
        return bytes.length;
    }

    async function runConnectivityIfRequested() {
        if (connectivityInFlight) {
            return;
        }
        const requestLength = instance.exports.ExportConnectivityRequestJson();
        if (requestLength === 0) {
            return;
        }
        const buffer = instance.exports.GetInventoryJsonBuffer();
        const requestJson = textDecoder.decode(
            new Uint8Array(instance.exports.memory.buffer, buffer, requestLength));
        connectivityInFlight = true;
        try {
            const response = await fetch("/api/connectivity/run", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: requestJson,
            });
            const responseText = await response.text();
            if (!response.ok) {
                throw new Error(responseText || `HTTP ${response.status}`);
            }
            const result = JSON.parse(responseText);
            if (result.inventory_changed) {
                await loadInventory();
            }
            const resultLength = writeSharedJson(responseText);
            if (resultLength === 0 || !instance.exports.ImportConnectivityResultJson(resultLength)) {
                throw new Error("Could not import connectivity result");
            }
            setSharedLabel("Mode: connected to server | commands run on server PC");
        } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            const messageLength = writeSharedJson(message);
            instance.exports.FailConnectivityRequest(messageLength);
        } finally {
            connectivityInFlight = false;
        }
    }

    async function runSensorImportIfRequested() {
        if (sensorImportInFlight || !instance.exports.TakeSensorImportRequest()) {
            return;
        }
        sensorImportInFlight = true;
        try {
            const response = await fetch("/api/sensors/import", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: "{}",
            });
            const responseText = await response.text();
            if (!response.ok) {
                throw new Error(responseText || `HTTP ${response.status}`);
            }
            const length = writeSharedJson(responseText);
            if (length === 0 || !instance.exports.ImportSensorImportResultJson(length)) {
                throw new Error("Could not import sensor result");
            }
            setSharedLabel("Mode: connected to server | sensor files stored on server PC");
        } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            const messageLength = writeSharedJson(message);
            instance.exports.FailSensorImport(messageLength);
        } finally {
            sensorImportInFlight = false;
        }
    }

    async function init() {
        window.htmlRoot = document.body.appendChild(document.createElement('div'));
        window.canvasRoot = document.body.appendChild(document.createElement('canvas'));
        window.canvasContext = window.canvasRoot.getContext("2d");
        window.mousePositionXThisFrame = 0;
        window.mousePositionYThisFrame = 0;
        window.mouseWheelXThisFrame = 0;
        window.mouseWheelYThisFrame = 0;
        window.touchDown = false;
        let zeroTimeout = null;
        addEventListener("wheel", (event) => {
            window.mouseWheelXThisFrame = event.deltaX * -0.1;
            window.mouseWheelYThisFrame = event.deltaY * -0.1;
            clearTimeout(zeroTimeout);
            zeroTimeout = setTimeout(() => {
                window.mouseWheelXThisFrame = 0;
                window.mouseWheelYThisFrame = 0;
            }, 10);
        });

        function handleTouch(event) {
            if (event.touches.length === 1) {
                window.touchDown = true;
                window.mousePositionXThisFrame = event.changedTouches[0].pageX;
                window.mousePositionYThisFrame = event.changedTouches[0].pageY;
            }
        }

        document.addEventListener("touchstart", handleTouch);
        document.addEventListener("touchmove", handleTouch);
        document.addEventListener("touchend", () => {
            window.touchDown = false;
            window.mousePositionXThisFrame = 0;
            window.mousePositionYThisFrame = 0;
        })

        document.addEventListener("mousemove", (event) => {
            window.mousePositionXThisFrame = event.x;
            window.mousePositionYThisFrame = event.y;
        });

        document.addEventListener("mousedown", (event) => {
            window.mousePositionXThisFrame = event.x;
            window.mousePositionYThisFrame = event.y;
            window.mouseDown = true;
        });

        document.addEventListener("keydown", (event) => {
            const actionByKey = {
                n: PROGTP_APP_ACTION_NEXT,
                p: PROGTP_APP_ACTION_PREVIOUS,
                a: PROGTP_APP_ACTION_ADD_SAMPLE,
                u: PROGTP_APP_ACTION_UPDATE_SELECTED,
                r: PROGTP_APP_ACTION_REMOVE_SELECTED,
                "1": PROGTP_APP_ACTION_MODULE_1,
                "2": PROGTP_APP_ACTION_MODULE_2,
                "3": PROGTP_APP_ACTION_MODULE_3,
                "4": PROGTP_APP_ACTION_MODULE_4,
                "5": PROGTP_APP_ACTION_MODULE_5,
                "6": PROGTP_APP_ACTION_MODULE_6,
                "7": PROGTP_APP_ACTION_MODULE_7,
                "8": PROGTP_APP_ACTION_MODULE_8,
                g: PROGTP_APP_ACTION_SENSOR_IMPORT,
                c: PROGTP_APP_ACTION_SEARCH_CODE,
                i: PROGTP_APP_ACTION_SEARCH_IP,
                m: PROGTP_APP_ACTION_SEARCH_MAC,
                w: PROGTP_APP_ACTION_SAVE,
                l: PROGTP_APP_ACTION_LOAD,
            };
            if (event.key === "Backspace") {
                pendingInputEvents.push({ action: PROGTP_APP_ACTION_INPUT_BACKSPACE, codepoint: 0 });
                event.preventDefault();
            } else if (event.key === "Enter") {
                pendingInputEvents.push({ action: PROGTP_APP_ACTION_INPUT_SUBMIT, codepoint: 0 });
                event.preventDefault();
            } else if (event.key === "Escape") {
                pendingInputEvents.push({ action: PROGTP_APP_ACTION_FORM_CANCEL, codepoint: 0 });
                event.preventDefault();
            } else if (event.key === "Tab") {
                pendingInputEvents.push({ action: event.shiftKey ? PROGTP_APP_ACTION_FORM_PREVIOUS_FIELD : PROGTP_APP_ACTION_FORM_NEXT_FIELD, codepoint: 0 });
                event.preventDefault();
            } else {
                const lowerKey = event.key.length === 1 ? event.key.toLowerCase() : event.key;
                if (Object.prototype.hasOwnProperty.call(actionByKey, lowerKey)) {
                    pendingInputEvents.push({
                        action: actionByKey[lowerKey],
                        codepoint: event.key.length === 1 ? event.key.charCodeAt(0) : 0,
                    });
                    event.preventDefault();
                } else if (event.key.length === 1) {
                    pendingInputEvents.push({ action: PROGTP_APP_ACTION_NONE, codepoint: event.key.charCodeAt(0) });
                    event.preventDefault();
                }
            }
        });

        const module = await window.createProgTPModule({
            locateFile: (path) => path.endsWith(".wasm") ? "./index.wasm" : path,
        });
        const memory = {};
        Object.defineProperty(memory, "buffer", { get: () => module.HEAPU8.buffer });
        instance = {
            exports: {
                memory,
                GetCommandLabelBuffer: module._GetCommandLabelBuffer,
                GetCommandLabelCapacity: module._GetCommandLabelCapacity,
                GetRenderCommandsBuffer: module._GetRenderCommandsBuffer,
                GetInventoryJsonBuffer: module._GetInventoryJsonBuffer,
                GetInventoryJsonCapacity: module._GetInventoryJsonCapacity,
                ImportInventoryJson: module._ImportInventoryJson,
                ImportSensorsJson: module._ImportSensorsJson,
                ExportInventoryJson: module._ExportInventoryJson,
                IsInventoryDirty: module._IsInventoryDirty,
                GetInventoryVersion: module._GetInventoryVersion,
                MarkInventoryClean: module._MarkInventoryClean,
                ExportConnectivityRequestJson: module._ExportConnectivityRequestJson,
                ImportConnectivityResultJson: module._ImportConnectivityResultJson,
                FailConnectivityRequest: module._FailConnectivityRequest,
                TakeSensorImportRequest: module._TakeSensorImportRequest,
                ImportSensorImportResultJson: module._ImportSensorImportResultJson,
                FailSensorImport: module._FailSensorImport,
                InitializeClay: module._InitializeClay,
                UpdateDrawFrame: module._UpdateDrawFrame,
            },
        };
        memoryDataView = new DataView(instance.exports.memory.buffer);
        scratchSpaceAddress = instance.exports.GetRenderCommandsBuffer();
        heapSpaceAddress = 0;
        window.instance = instance;
        instance.exports.InitializeClay(window.innerWidth, window.innerHeight);
        memoryDataView = new DataView(instance.exports.memory.buffer);
        renderCommandSize = getStructTotalSize(renderCommandDefinition);
        previousFrameTime = performance.now();
        await loadInventory();
        loadSensors();
        loadCommandLabel();
        renderLoop(performance.now());
    }

    function MemoryIsDifferent(one, two, length) {
        for (let i = 0; i < length; i++) {
            if (one[i] !== two[i]) {
                return true;
            }
        }
        return false;
    }

    function renderLoopHTML() {
        let capacity = memoryDataView.getUint32(scratchSpaceAddress, true);
        let length = memoryDataView.getUint32(scratchSpaceAddress + 4, true);
        let arrayOffset = memoryDataView.getUint32(scratchSpaceAddress + 8, true);
        let scissorStack = [{ nextAllocation: { x: 0, y: 0 }, element: htmlRoot, nextElementIndex: 0 }];
        for (let i = 0; i < length; i++, arrayOffset += renderCommandSize) {
            let entireRenderCommandMemory = new Uint32Array(memoryDataView.buffer.slice(arrayOffset, arrayOffset + renderCommandSize));
            let renderCommand = readStructAtAddress(arrayOffset, renderCommandDefinition);
            let parentElement = scissorStack[scissorStack.length - 1];
            let element = null;
            if (!elementCache[renderCommand.id.value]) {
                let elementType = 'div';
                switch (renderCommand.commandType.value & 0xff) {
                    case CLAY_RENDER_COMMAND_TYPE_IMAGE: { elementType = 'img'; break; }
                    default: break;
                }
                element = document.createElement(elementType);
                element.id = renderCommand.id.value;
                if (renderCommand.commandType.value === CLAY_RENDER_COMMAND_TYPE_SCISSOR_START) {
                    element.style.overflow = 'hidden';
                }
                elementCache[renderCommand.id.value] = {
                    exists: true,
                    element: element,
                    previousMemoryCommand: new Uint8Array(0),
                    previousMemoryConfig: new Uint8Array(0),
                    previousMemoryText: new Uint8Array(0)
                };
            }

            let elementData = elementCache[renderCommand.id.value];
            element = elementData.element;
            if (Array.prototype.indexOf.call(parentElement.element.children, element) !== parentElement.nextElementIndex) {
                if (parentElement.nextElementIndex === 0 || !parentElement.element.childNodes[parentElement.nextElementIndex - 1]) {
                    parentElement.element.insertAdjacentElement('afterbegin', element);
                } else {
                    parentElement.element.childNodes[parentElement.nextElementIndex - 1].insertAdjacentElement('afterend', element);
                }
            }

            elementData.exists = true;
            // Don't get me started. Cheaper to compare the render command memory than to update HTML elements
            let dirty = MemoryIsDifferent(elementData.previousMemoryCommand, entireRenderCommandMemory, renderCommandSize);
            parentElement.nextElementIndex++;

            elementData.previousMemoryCommand = entireRenderCommandMemory;
            let offsetX = scissorStack.length > 0 ? scissorStack[scissorStack.length - 1].nextAllocation.x : 0;
            let offsetY = scissorStack.length > 0 ? scissorStack[scissorStack.length - 1].nextAllocation.y : 0;
            if (dirty) {
                element.style.transform = `translate(${Math.round(renderCommand.boundingBox.x.value - offsetX)}px, ${Math.round(renderCommand.boundingBox.y.value - offsetY)}px)`
                element.style.width = Math.round(renderCommand.boundingBox.width.value) + 'px';
                element.style.height = Math.round(renderCommand.boundingBox.height.value) + 'px';
            }

            // note: commandType is packed to uint8_t and has 3 garbage bytes of padding
            switch(renderCommand.commandType.value & 0xff) {
                case (CLAY_RENDER_COMMAND_TYPE_NONE): {
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_RECTANGLE): {
                    if (!dirty) {
                         break;
                    }
                    let config = renderCommand.renderData.rectangle;
                    let color = config.backgroundColor;
                    element.style.backgroundColor = `rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`;
                    if (config.cornerRadius.topLeft.value > 0) {
                        element.style.borderTopLeftRadius = config.cornerRadius.topLeft.value + 'px';
                    }
                    if (config.cornerRadius.topRight.value > 0) {
                        element.style.borderTopRightRadius = config.cornerRadius.topRight.value + 'px';
                    }
                    if (config.cornerRadius.bottomLeft.value > 0) {
                        element.style.borderBottomLeftRadius = config.cornerRadius.bottomLeft.value + 'px';
                    }
                    if (config.cornerRadius.bottomRight.value > 0) {
                        element.style.borderBottomRightRadius = config.cornerRadius.bottomRight.value + 'px';
                    }
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_BORDER): {
                    if (!dirty) {
                        break;
                    }
                    let config = renderCommand.renderData.border;
                    let color = config.color;
                    if (config.width.left.value > 0) {
                        element.style.borderLeft = `${config.width.left.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.width.right.value > 0) {
                        element.style.borderRight = `${config.width.right.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.width.top.value > 0) {
                        element.style.borderTop = `${config.width.top.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.width.bottom.value > 0) {
                        element.style.borderBottom = `${config.width.bottom.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.cornerRadius.topLeft.value > 0) {
                        element.style.borderTopLeftRadius = config.cornerRadius.topLeft.value + 'px';
                    }
                    if (config.cornerRadius.topRight.value > 0) {
                        element.style.borderTopRightRadius = config.cornerRadius.topRight.value + 'px';
                    }
                    if (config.cornerRadius.bottomLeft.value > 0) {
                        element.style.borderBottomLeftRadius = config.cornerRadius.bottomLeft.value + 'px';
                    }
                    if (config.cornerRadius.bottomRight.value > 0) {
                        element.style.borderBottomRightRadius = config.cornerRadius.bottomRight.value + 'px';
                    }
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_TEXT): {
                    let config = renderCommand.renderData.text;
                    let textContents = config.stringContents;
                    let stringContents = new Uint8Array(memoryDataView.buffer.slice(textContents.chars.value, textContents.chars.value + textContents.length.value));
                    if (dirty) {
                        element.className = 'text';
                        let textColor = config.textColor;
                        let fontSize = Math.round(config.fontSize.value * GLOBAL_FONT_SCALING_FACTOR);
                        element.style.color = `rgba(${textColor.r.value}, ${textColor.g.value}, ${textColor.b.value}, ${textColor.a.value})`;
                        element.style.fontFamily = fontsById[config.fontId.value];
                        element.style.fontSize = fontSize + 'px';
                        element.style.pointerEvents = 'all';
                    }
                    if (stringContents.length !== elementData.previousMemoryText.length || MemoryIsDifferent(stringContents, elementData.previousMemoryText, stringContents.length)) {
                        element.innerHTML = textDecoder.decode(stringContents);
                    }
                    elementData.previousMemoryText = stringContents;
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_SCISSOR_START): {
                    scissorStack.push({ nextAllocation: { x: renderCommand.boundingBox.x.value, y: renderCommand.boundingBox.y.value }, element, nextElementIndex: 0 });
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_SCISSOR_END): {
                    scissorStack.splice(scissorStack.length - 1, 1);
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_IMAGE): {
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_CUSTOM): break;
            }
        }

        for (const key of Object.keys(elementCache)) {
            if (elementCache[key].exists) {
                elementCache[key].exists = false;
            } else {
                elementCache[key].element.remove();
                delete elementCache[key];
            }
        }
    }

    function renderLoop(currentTime) {
        try {
            const elapsed = currentTime - previousFrameTime;
            previousFrameTime = currentTime;
            const inputEvent = pendingInputEvents.shift() || { action: PROGTP_APP_ACTION_NONE, codepoint: 0 };
            instance.exports.UpdateDrawFrame(scratchSpaceAddress, window.innerWidth, window.innerHeight, window.mouseWheelXThisFrame, window.mouseWheelYThisFrame, window.mousePositionXThisFrame, window.mousePositionYThisFrame, window.touchDown, window.mouseDown, inputEvent.action, inputEvent.codepoint, elapsed / 1000);
            memoryDataView = new DataView(instance.exports.memory.buffer);
            renderLoopHTML();
            saveInventoryIfDirty();
            runConnectivityIfRequested();
            runSensorImportIfRequested();
            requestAnimationFrame(renderLoop);
            window.mouseDown = false;
        } catch (error) {
            document.body.dataset.renderError = String(error && error.stack ? error.stack : error);
            throw error;
        }
    }
    init().catch((error) => {
        document.body.dataset.progtpInit = "failed";
        document.body.dataset.progtpInitError = String(error && error.stack ? error.stack : error);
        throw error;
    });
</script>
